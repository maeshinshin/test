# Envoy reverse proxy for RandomStream.
#
# This config fronts a single Go backend that serves the SPA + a Connect
# server-streaming RPC (streaming.v1.RandomStreamer/StreamRandom) over
# HTTP/1.1 + h2c on 127.0.0.1:8080.
#
# - TLS is terminated on Envoy (certs from a mounted secret / SDS).
# - HTTP/2 is enabled on the listener and on the upstream so server
#   streaming works end-to-end.
# - Streaming routes use `stream_idle_timeout` of 120s (the server streams
#   for up to ~1 minute).

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  virtual_hosts:
                    - name: redirect
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/.well-known/acme-challenge/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: ""
                        - match:
                            prefix: "/"
                          redirect:
                            https_redirect: true
                            response_code: 301
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: ingress_https
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: server_cert
                    sds_config:
                      path: /etc/envoy/certs/server.yaml
              require_client_certificate: false
              alpn_protocols: ["h2", "http/1.1"]
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO
                http2_protocol_options:
                  allow_connect: true
                  initial_stream_window_size: 65536
                  initial_connection_window_size: 1048576
                stream_idle_timeout: 120s
                common_http_protocol_options:
                  idle_timeout: 120s
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # Health check.
                        - match:
                            prefix: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "ok\n"
                        # Connect RPC endpoint pattern: "/<package>.<Service>/<Method>".
                        # A regex match would be ideal but Envoy's prefix matcher is
                        # simpler; /<pkg>.<svc>/<method> paths always contain a "/"
                        # before the method, and we keep "/" as the SPA fallback
                        # last so RPC routes win via longest prefix.
                        - match:
                            prefix: "/streaming.v1.RandomStreamer/"
                          route:
                            cluster: streaming_backend
                            timeout: 0s
                            max_stream_duration: 120s
                            # No retry on streaming; failure is terminal.
                            retry_policy: {}
                        # SPA static assets + SPA fallback (index.html).
                        - match:
                            prefix: "/"
                          route:
                            cluster: streaming_backend
                            timeout: 0s
                            max_stream_duration: 120s
                http_filters:
                  - name: envoy.filters.http.compressor
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
                      compressor_library:
                        name: gzip
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
                          memory_level: 9
                          compression_level: 5
                      response_direction_config:
                        common_config:
                          enabled:
                            default_value: true
                            runtime_key: response_compressor_enabled
                      request_direction_config:
                        common_config:
                          enabled:
                            default_value: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: streaming_backend
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          upstream_protocol_options:
            # Speak HTTP/2 (h2c) to the Go backend so streaming works.
            explicit_http_protocol_options:
              protocol: HTTP2
          common_http_protocol_options:
            idle_timeout: 120s
      load_assignment:
        cluster_name: streaming_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8080
