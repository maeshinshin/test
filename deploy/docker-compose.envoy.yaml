# Compose stack: backend (Go) + Envoy reverse proxy, with a self-signed
# cert generated at first start.
#
# Usage:
#   SERVER_NAME="example.com,api.example.com" \
#   SERVER_IP="203.0.113.10,127.0.0.1" \
#   HTTP_PORT=80 HTTPS_PORT=443 ADMIN_PORT=9901 \
#   docker compose -f deploy/docker-compose.envoy.yaml up -d

services:
  cert-init:
    image: alpine:3.20
    volumes:
      - ./certs:/work
    environment:
      SERVER_NAME: "${SERVER_NAME:-localhost,example.com}"
      SERVER_IP:   "${SERVER_IP:-127.0.0.1}"
      DAYS:        "${DAYS:-365}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /work/fullchain.pem ] && [ -f /work/privkey.pem ]; then
          echo "Cert already present, skipping generation."
          exit 0
        fi
        apk add --no-cache openssl bash >/dev/null
        /work/generate-selfsigned.sh
    restart: "no"

  backend:
    # Image is pulled from GHCR; override with IMAGE_TAG=<tag> if needed.
    image: ghcr.io/maeshinshin/test:${IMAGE_TAG:-dev}
    restart: unless-stopped
    pull_policy: always
    expose:
      - "8080"
    command:
      - "-a"
      - "0.0.0.0"
      - "-p"
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${ADMIN_PORT:-9901}:9901"
    command:
      - "--config-path"
      - "/etc/envoy/envoy.yaml"
      - "--log-level"
      - "info"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/etc/envoy/certs:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge
