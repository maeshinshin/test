services:
  cert-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ./certs:/work
    environment:
      CERT_HOSTNAME: "${CERT_HOSTNAME:-localhost}"
      CERT_SAN:      "${CERT_SAN:-localhost,127.0.0.1}"
      DAYS:          "${DAYS:-365}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /work/fullchain.pem ] && [ -f /work/privkey.pem ]; then
          echo "Cert already present, skipping generation."
          exit 0
        fi
        apk add --no-cache openssl bash >/dev/null
        /work/generate-selfsigned.sh

  backend:
    image: randomstream-backend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["-a", "0.0.0.0", "-p", "8080"]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/fullchain.pem:/etc/letsencrypt/live/randomstream/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/letsencrypt/live/randomstream/privkey.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

networks:
  internal:
    driver: bridge
