# Reverse proxy for RandomStream, served under the /app/ prefix.
#
# Backend (Go) listens on HTTP/1.1 + h2c inside the Compose `internal` network.
# nginx terminates TLS and forwards /app/streaming.v1.RandomStreamer/* (ConnectRPC
# server-streaming RPC) plus the embedded SPA. `proxy_buffering off` and
# `proxy_read_timeout 130s` keep the 1-minute stream flowing through to clients.
#
# The cert/key paths below are satisfied by the bind mounts in
# deploy/docker-compose.nginx.yaml. Replace the files in deploy/certs/ with
# your own to use a real certificate.

upstream randomstream_backend {
    server backend:8080;
    keepalive 32;
}

# Default proxy headers needed for ConnectRPC streaming responses.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 130s;
proxy_send_timeout 130s;

# HTTP -> HTTPS redirect. ACME http-01 challenges are served from
# /var/www/acme (the certbot webroot) so renewal still works.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server. TLS is terminated by nginx; traffic to the backend is plain
# HTTP/1.1 (with the h2c upgrade header) so ConnectRPC streaming works
# end-to-end. The SPA and the ConnectRPC endpoint are both served under /app/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/randomstream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/randomstream/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # /app/healthz -> backend's /. Backend is also exposed at /healthz.
    location = /app/healthz {
        access_log off;
        proxy_pass http://randomstream_backend/;
    }

    # /app/streaming.v1.RandomStreamer/... -> backend's /streaming.v1.RandomStreamer/...
    # Trailing slash rewrites the prefix, then the rest of the path is preserved.
    location ~ ^/app/streaming\.v1\.RandomStreamer/(.*)$ {
        proxy_pass http://randomstream_backend/streaming.v1.RandomStreamer/$1$is_args$args;
    }

    # /app/ -> the embedded SPA (static assets + index.html fallback).
    location /app/ {
        proxy_pass http://randomstream_backend/;
    }
}
