# Reverse proxy for RandomStream.
#
# Backend (Go) listens on 127.0.0.1:8080 with HTTP/1.1 + h2c (unencrypted
# HTTP/2). The Connect protocol uses server-streaming RPC, so we need to:
#   - keep proxy_buffering off
#   - proxy_http_version 1.1 with "Connection: \"\"" to forward h2c to the Go server
#   - allow long-lived requests (>= 65s, since the server streams for ~1 minute)
#
# TLS is terminated here; certs are managed externally (e.g. certbot, mkcert).

# Upstream to the Go backend. h2c requires HTTP/1.1 upgrade semantics.
upstream streaming_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME http-01 challenge passthrough (certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Note: a strict CSP can break Vite-inlined assets; loosen as needed.

    # Long-lived streaming: a server-streaming RPC can run up to ~1 minute.
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # Bypass buffering so characters stream through to the browser as they arrive.
    proxy_buffering     off;
    proxy_request_buffering off;
    proxy_cache         off;

    # gRPC / Connect streaming requires HTTP/2 end-to-end. We forward HTTP/1.1
    # to the Go server with a clean Connection header so it can do h2c upgrade.
    proxy_http_version  1.1;
    proxy_set_header    Connection          "";
    proxy_set_header    Host                $host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   $scheme;

    # Health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Connect RPC endpoint. URL is "/<package>.<Service>/<Method>".
    location ~ ^/[^/]+\.[^/]+\.[^/]+/ {
        proxy_pass http://streaming_backend;
    }

    # Everything else: SPA static assets + SPA fallback.
    location / {
        proxy_pass http://streaming_backend;
    }
}
